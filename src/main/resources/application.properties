spring.application.name=GeminiChatBotRag

spring.ai.google.genai.api-key = ${GOOGLE_KEY}
spring.ai.google.genai.embedding.api-key = ${GOOGLE_EMBEDDING_KEY}
spring.ai.google.genai.chat.options.model = gemini-3.1-flash-lite
spring.ai.google.genai.embedding.text.options.dimensions=1024
spring.ai.google.genai.embedding.text.options.model = gemini-embedding-2

spring.ai.vectorstore.pinecone.api-key= ${PINECONE_KEY}
spring.ai.vectorstore.pinecone.index-name=shop-support-vectors
spring.ai.vectorstore.pinecone.namespace=policies


